<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181b20"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2028" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff5258" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2028" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ff2028" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff7b80" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Top App Header Mockup -->
  <rect x="40" y="36" width="720" height="48" rx="8" fill="#20242b" stroke="#323742" stroke-width="1"/>
  <circle cx="68" cy="60" r="5" fill="#ff4d52"/>
  <circle cx="86" cy="60" r="5" fill="#f59e0b"/>
  <circle cx="104" cy="60" r="5" fill="#10b981"/>
  <text x="130" y="65" fill="#8f96a3" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Tuberculosis Expert System — Dempster-Shafer Diagnostic Engine</text>
  <rect x="650" y="48" width="90" height="24" rx="12" fill="#ff2028" fill-opacity="0.15" stroke="#ff2028" stroke-width="1"/>
  <text x="695" y="64" fill="#ff7b80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ONLINE AI</text>

  <!-- Left Card: Patient Symptom Matrix -->
  <rect x="40" y="104" width="300" height="348" rx="12" fill="#1c1f26" stroke="#2d323d" stroke-width="1"/>
  <text x="64" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Clinical Symptom Matrix</text>
  <text x="64" y="162" fill="#757e8d" font-family="system-ui, sans-serif" font-size="12">Dempster-Shafer Evidential Mass</text>

  <!-- Symptom Row 1 -->
  <rect x="64" y="186" width="252" height="42" rx="8" fill="#242933"/>
  <text x="80" y="211" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Persistent Cough (&gt;3 weeks)</text>
  <text x="290" y="211" fill="#ff4d52" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">m=0.85</text>

  <!-- Symptom Row 2 -->
  <rect x="64" y="238" width="252" height="42" rx="8" fill="#242933"/>
  <text x="80" y="263" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Hemoptysis (Batuk Darah)</text>
  <text x="290" y="263" fill="#ff4d52" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">m=0.92</text>

  <!-- Symptom Row 3 -->
  <rect x="64" y="290" width="252" height="42" rx="8" fill="#242933"/>
  <text x="80" y="315" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Nocturnal Fever &amp; Sweats</text>
  <text x="290" y="315" fill="#ff4d52" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">m=0.78</text>

  <!-- Symptom Row 4 -->
  <rect x="64" y="342" width="252" height="42" rx="8" fill="#242933"/>
  <text x="80" y="367" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Unexplained Weight Loss</text>
  <text x="290" y="367" fill="#ff4d52" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="end">m=0.74</text>

  <!-- Matrix Status -->
  <rect x="64" y="396" width="252" height="38" rx="8" fill="#ff2028" fill-opacity="0.12" stroke="#ff2028" stroke-width="1"/>
  <text x="190" y="420" fill="#ff7b80" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Rule Combination: Validated</text>

  <!-- Right Top Card: Diagnostic Probability Gauge -->
  <rect x="360" y="104" width="400" height="190" rx="12" fill="#1c1f26" stroke="#2d323d" stroke-width="1"/>
  <text x="384" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Diagnostic Confidence Index</text>
  <text x="384" y="162" fill="#757e8d" font-family="system-ui, sans-serif" font-size="12">Dempster's Rule of Combination Result</text>

  <g transform="translate(384, 185)">
    <!-- Confidence Arc / Progress -->
    <rect x="0" y="0" width="352" height="18" rx="9" fill="#262c37"/>
    <rect x="0" y="0" width="332" height="18" rx="9" fill="url(#lineGrad)"/>
    <text x="0" y="45" fill="#ff7b80" font-family="system-ui, sans-serif" font-size="34" font-weight="800">94.6%</text>
    <text x="116" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">High Probability TB Infection</text>
    <text x="116" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Recommendation: Sputum Acid-Fast Bacillus (AFB) Test</text>
  </g>

  <!-- Right Bottom Card: Diagnostic Waveform & AI Nodes -->
  <rect x="360" y="310" width="400" height="142" rx="12" fill="#1c1f26" stroke="#2d323d" stroke-width="1"/>
  <text x="384" y="338" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">MEDICAL PULSE &amp; EVIDENTIAL WEIGHT</text>

  <!-- Pulse Waveform line -->
  <path d="M 384 395 L 450 395 L 465 375 L 480 420 L 495 345 L 510 415 L 525 390 L 540 395 L 610 395 L 625 370 L 640 425 L 655 350 L 670 410 L 685 395 L 735 395" 
        fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>